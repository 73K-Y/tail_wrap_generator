name: "CodeQL - Code Scanning"

on:
  push:
    branches:
      - main
      - tail_wrap_generator
  pull_request:
    branches:
      - main
      - tail_wrap_generator
  schedule:
    # Scansione automatica ogni lunedì alle 08:00 UTC
    - cron: "0 8 * * 1"

jobs:
  analyze:
    name: Analyze Python
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      security-events: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v3
        with:
          languages: python
          # Regole di sicurezza estese (rileva più vulnerabilità)
          queries: security-extended

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v3
        with:
          category: "/language:python"
